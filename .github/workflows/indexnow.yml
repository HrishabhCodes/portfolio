# Notify IndexNow (Bing, Yandex, Seznam, Naver, Yep; Bing powers ChatGPT search and
# Copilot) after every successful production deploy, so changed pages get recrawled fast.
# Runs on Vercel's GitHub deployment status, i.e. only once the new version is live.
# With several Vercel projects on one repo the environment is named "Production – <project>",
# so match by prefix. Preview deploys (branches) are skipped on purpose.
name: IndexNow

on:
  deployment_status:
  workflow_dispatch:

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    env:
      HOST: hrishabh.in
      KEY: bfc5e2ad4fcb2094028059f8dc3b6c7a
    steps:
      - name: Submit sitemap URLs
        run: |
          set -euo pipefail
          urls=$(curl -fsS "https://$HOST/sitemap-0.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          echo "Submitting: $urls"
          body=$(jq -n --arg host "$HOST" --arg key "$KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}')
          status=$(curl -sS -o /dev/stderr -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow responded $status"
          case "$status" in 200|202) ;; *) exit 1 ;; esac
